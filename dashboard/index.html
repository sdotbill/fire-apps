<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dave — Dashboard</title>
<link rel="icon" type="image/png" href="/assets/baby-dave-64.png">
<link rel="apple-touch-icon" href="/assets/baby-dave-180.png">
<meta name="robots" content="noindex, nofollow">
<!-- Build stamp (parity convergence, Nov 16 2026): ONE dashboard, one
     source of truth. The stamp names the repo revision this copy was
     minted from (dashboard/stamp-build.sh rewrites it at build time).
     The self-check below compares the RUNNING copy's stamp against the
     SERVED copy's stamp and reloads once if they differ — so a copy
     held in an installed app's memory across a deploy converges to the
     live build instead of drifting (Bill, Nov 16 02:01 EST: the app
     showed an old rail while the site was already correct). -->
<meta name="x-dash-build" content="e5deb8c7-20261116T0816">
<script>
(function(){
  var mine = document.querySelector('meta[name="x-dash-build"]');
  mine = mine && mine.getAttribute("content");
  if(!mine || mine === "unstamped" || !window.fetch) return;
  function check(){
    fetch(location.pathname + "?_stampcheck=" + Date.now(), {cache:"no-store"})
      .then(function(r){ return r.text(); })
      .then(function(html){
        var m = html.match(/name="x-dash-build"\s+content="([^"]+)"/);
        if(!m || m[1] === mine) return;
        try{
          if(sessionStorage.getItem("dash-stamp-reloaded") === m[1]) return;
          sessionStorage.setItem("dash-stamp-reloaded", m[1]);
        }catch(e){ return; }
        location.reload();
      })
      .catch(function(){});
  }
  window.addEventListener("load", function(){ setTimeout(check, 1500); });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") check();
  });
})();
</script>
<link rel="manifest" href="/dashboard/manifest.webmanifest">
<meta name="theme-color" content="#c9a227">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    color-scheme:light;
    /* The main site's palette (pms.css): warm paper white, gold accents. */
    --bg:#faf7ef; --bg2:#fffdf6; --panel:#fffdf6; --panel2:#f3ecdb;
    --line:rgba(160,124,20,.35); --ink:#2a2118; --muted:#5c5142; --faint:#97865c;
    --amber:#c9a227; --amber2:#8a6508; --blue:#8a6508; --blue2:#c9a227;
    --gold:#c9a227; --gold-deep:#8a6508; --gold-bright:#eed268; --dark2:#241a02;
    --user:#c9a227; --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  a{color:var(--blue);}
  [hidden]{display:none !important;}

  /* ================= layout ================= */
  .app{display:flex;height:100vh;height:100dvh;width:100%;}
  .rail{
    flex:none;width:58px;background:var(--bg2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;z-index:30;
  }
  .rail button{
    width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:1.15rem;color:var(--muted);position:relative;
  }
  .rail button:hover{background:var(--panel2);color:var(--ink);}
  .rail button.on{background:var(--panel2);color:var(--amber2);}
  .rail .sp{flex:1;}
  .rail .eye-mini{font-size:1.3rem;color:var(--amber);}
  /* Exolex University rail item (Bill, Nov 16 01:04 EST placement;
     renamed 01:22 EST): the University sits in the left-hand sidebar
     itself, word and all — never in the sign-in gate, never in a
     hamburger. The word rides under the flask so the sidebar SAYS
     Exolex University at every width, phone included. */
  #rail-lab{flex-direction:column;gap:1px;height:auto;min-height:42px;padding:5px 0 4px;}
  #rail-lab .rail-word{font-size:.52rem;font-weight:700;letter-spacing:.03em;line-height:1.15;color:inherit;text-align:center;}
  .panel{
    flex:none;width:284px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;z-index:20;
  }
  .panel-head{
    padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .panel-head h2{font-size:1.02rem;font-weight:700;letter-spacing:.01em;}
  .panel-body{flex:1;overflow-y:auto;padding:2px 10px 14px;min-height:0;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);}
  .brain{
    flex:none;width:308px;background:var(--panel);border-left:1px solid var(--line);
    display:none;flex-direction:column;min-height:0;z-index:20;
  }
  .brain.open{display:flex;}

  /* ================= top bar ================= */
  .topbar{
    flex:none;display:flex;align-items:center;gap:10px;
    padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2);
  }
  .topbar .title{font-weight:700;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .sp{flex:1;}
  .tbtn{
    display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;
    border:1.5px solid var(--line);background:var(--panel2);font-weight:600;font-size:.92rem;color:var(--ink);
  }
  .tbtn:hover{border-color:var(--gold-deep);}
  .install-note{
    flex:none;padding:9px 16px;background:var(--panel2);border-bottom:1px solid var(--line);
    color:var(--muted);font-size:.9rem;text-align:center;
  }
  .iconbtn{width:40px;height:40px;border-radius:12px;display:none;align-items:center;justify-content:center;font-size:1.1rem;color:var(--muted);}
  .iconbtn:hover{background:var(--panel2);color:var(--ink);}
  /* The top-bar eye is a brand mark only — not a button, and it
     never toggles the brain (round 4: one brain control, the eye
     under the + in the composer). */
  .eye-brand{flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:#faf7ef;}
  .eye-brand img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 50%;}

  /* ================= chat ================= */
  .thread{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:10px;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .thread-inner{width:100%;max-width:46rem;margin:0 auto;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:85%;padding:10px 14px;border-radius:18px;font-size:.99rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  .msg-dave{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:6px;}
  .msg-user{align-self:flex-end;background:var(--gold);border:1px solid var(--gold-deep);color:var(--dark2);border-bottom-right-radius:6px;}
  .msg img.att{max-width:240px;border-radius:12px;display:block;margin-top:6px;}
  .msg .attname{font-size:.82rem;opacity:.85;}
  .typing i{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--muted);animation:tbl 1.1s infinite;}
  .typing i:nth-child(2){animation-delay:.18s;} .typing i:nth-child(3){animation-delay:.36s;margin-right:0;}
  @keyframes tbl{0%,60%,100%{opacity:.25;}30%{opacity:1;}}
  .empty-note{color:var(--faint);text-align:center;margin:auto 0;padding:30px 10px;font-size:.95rem;}

  /* ================= composer ================= */
  .composer{flex:none;padding:8px 16px 14px;background:var(--bg);}
  .composer-inner{max-width:46rem;margin:0 auto;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 8px 4px 12px;font-size:.82rem;}
  .chip button{color:var(--muted);font-size:.95rem;line-height:1;padding:2px 4px;}
  .cbar{
    display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1.5px solid var(--line);border-radius:26px;padding:7px 8px;
  }
  .cbar:focus-within{border-color:var(--gold-deep);}
  .plusbtn{flex:none;width:40px;height:40px;border-radius:50%;font-size:1.35rem;color:var(--muted);display:flex;align-items:center;justify-content:center;}
  .plusbtn:hover{background:var(--panel2);color:var(--ink);}
  /* The + and, directly under it, the eye — the ONE brain control
     (round 4). The stack sits at the composer's left edge. */
  .cstack{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .eyebtn{width:40px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;border:1px solid var(--line);background:#faf7ef;cursor:pointer;}
  .eyebtn img{width:24px;height:24px;border-radius:50%;display:block;object-fit:cover;object-position:50% 50%;}
  .eyebtn.on{border-color:var(--gold-deep);box-shadow:0 0 0 2px var(--gold-bright);}
  .ctext{
    flex:1;border:none;background:transparent;color:var(--ink);font:inherit;font-size:1.02rem;
    resize:none;max-height:130px;padding:9px 2px;min-width:0;
  }
  .ctext:focus{outline:none;}
  .ctext::placeholder{color:var(--faint);}
  .micbtn,.sendbtn{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;}
  .micbtn{color:var(--muted);} .micbtn:hover{background:var(--panel2);color:var(--ink);}
  .micbtn.listening{background:#f3e3ae;color:var(--ink);}
  .sendbtn{background:var(--gold);border:1px solid var(--gold-deep);color:var(--dark2);}
  .sendbtn[disabled]{opacity:.5;cursor:wait;}
  .attachmenu{
    position:absolute;bottom:104px;left:16px;background:var(--panel2);border:1px solid var(--line);
    border-radius:16px;padding:6px;min-width:210px;box-shadow:0 14px 40px rgba(42,33,24,.28);z-index:40;
  }
  .attachmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:10px;font-size:.95rem;}
  .attachmenu button:hover{background:var(--panel);}
  .composer-wrap{position:relative;max-width:46rem;margin:0 auto;}

  /* ================= panel lists ================= */
  .conv{
    display:block;width:100%;text-align:left;padding:11px 12px;border-radius:14px;margin-bottom:4px;
  }
  .conv:hover{background:var(--panel2);}
  .conv.on{background:var(--panel2);}
  .conv .ct{font-weight:600;font-size:.95rem;display:flex;gap:8px;align-items:center;}
  .conv .cs{color:var(--muted);font-size:.83rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .conv .cw{color:var(--faint);font-size:.76rem;margin-top:2px;}
  .searchbox,.ideabox,.taskbox{
    width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;color:var(--ink);
    font:inherit;font-size:.95rem;padding:10px 13px;margin-bottom:10px;
  }
  .searchbox:focus,.ideabox:focus,.taskbox:focus{outline:none;border-color:var(--gold-deep);}
  .libitem{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;color:var(--ink);text-decoration:none;}
  .libitem:hover{background:var(--panel2);}
  .libitem small{display:block;color:var(--muted);font-size:.8rem;}
  .rowitem{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin-bottom:7px;font-size:.93rem;}
  .rowitem .grow{flex:1;word-break:break-word;}
  .rowitem button{color:var(--faint);padding:0 3px;}
  .rowitem.done .grow{color:var(--faint);text-decoration:line-through;}
  .mini{font-size:.8rem;color:var(--faint);}
  .addbtn{width:100%;padding:9px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);font-weight:600;}
  .addbtn:hover{color:var(--ink);border-color:var(--gold-deep);}
  .conv .cs{display:block;}
  .panel-sec{color:var(--faint);font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:16px 6px 6px;}
  .panel-sec:first-child{margin-top:2px;}
  .setrow{display:flex;gap:9px;align-items:center;padding:11px 12px;border-radius:12px;font-size:.95rem;}
  .setrow .grow{flex:1;word-break:break-word;}
  .setrow .val{color:var(--muted);font-size:.88rem;}
  .setrow .chev{color:var(--faint);}
  .invcode{font-size:1.2rem;font-weight:700;letter-spacing:.14em;text-align:center;background:var(--bg);border:1.5px dashed var(--gold-deep);border-radius:14px;padding:14px 10px;margin:8px 0;word-break:break-all;}
  .invlink{font-size:.82rem;color:var(--muted);word-break:break-all;text-align:center;margin-bottom:10px;}

  /* ================= brain / eye ================= */
  .brain-top{padding:20px 16px 12px;text-align:center;border-bottom:1px solid var(--line);}
  .eye-wrap{width:118px;height:118px;margin:0 auto 6px;position:relative;}
  .eye-wrap .eye-img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 50%;border-radius:50%;border:1px solid var(--line);background:#faf7ef;}
  .eye-name{font-family:'Fraunces',Georgia,serif;font-size:1.45rem;font-weight:700;}
  .eye-status{color:var(--muted);font-size:.9rem;margin-top:2px;min-height:1.35em;}
  .eye-status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ecf6f;margin-right:6px;vertical-align:1px;}
  .brain-head{padding:13px 16px 6px;display:flex;align-items:baseline;justify-content:space-between;}
  .brain-head h3{font-size:1rem;}
  .brain-head span{color:var(--faint);font-size:.78rem;}
  .feed{flex:1;overflow-y:auto;padding:2px 12px 16px;min-height:0;}
  .feed-day{color:var(--muted);font-weight:700;font-size:.85rem;margin:10px 4px 7px;}
  .job{display:flex;gap:11px;padding:10px 10px;border-radius:14px;background:var(--bg);border:1px solid var(--line);margin-bottom:7px;}
  .job .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:.95rem;}
  .job .jt{font-weight:600;font-size:.92rem;line-height:1.3;}
  .job .js{color:var(--muted);font-size:.83rem;line-height:1.35;}
  .job .jw{color:var(--faint);font-size:.76rem;margin-top:1px;}
  .feed-empty{color:var(--faint);font-size:.88rem;padding:6px 6px 0;}

  /* ================= gate ================= */
  .gate{
    position:fixed;inset:0;background:var(--bg);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .gate-card{width:100%;max-width:380px;text-align:center;}
  .gate-card .eye-wrap{width:96px;height:96px;}
  .gate-card h1{font-family:'Fraunces',Georgia,serif;font-size:1.7rem;margin:4px 0 4px;}
  .gate-card p{color:var(--muted);font-size:.95rem;margin-bottom:18px;}
  .gate-row{display:flex;gap:8px;}
  .gate-input{
    flex:1;background:#fff;border:1.5px solid var(--line);border-radius:999px;color:var(--ink);
    font:inherit;padding:12px 18px;min-width:0;
  }
  .gate-input:focus{outline:none;border-color:var(--gold-deep);}
  .gate-btn{flex:none;background:var(--gold);border:1px solid var(--gold-deep);color:var(--dark2);font-weight:600;border-radius:999px;padding:12px 22px;}
  .gate-err{color:#b3261e;font-size:.88rem;min-height:1.3em;margin-top:10px;}
  .gate-home{display:inline-block;margin-top:14px;color:var(--faint);font-size:.88rem;text-decoration:none;}
  .gate-home:hover{color:var(--muted);}
  .gate-form{display:flex;flex-direction:column;gap:8px;text-align:left;}
  .gate-label{font-size:.85rem;color:var(--muted);margin-top:6px;}
  .gate-form .gate-input{border-radius:16px;}
  .gate-btn-wide{width:100%;margin-top:10px;padding:13px 22px;}
  .gate-btn[disabled]{opacity:.55;cursor:wait;}
  .gate-alt{margin-top:16px;color:var(--muted);font-size:.92rem;}
  .gate-link{color:var(--blue);font-weight:600;font-size:.92rem;padding:0;}
  .gate-link:hover{color:var(--ink);}

  /* ================= responsive ================= */
  @media (min-width:761px){
    .panel.closed{display:none;}
  }
  @media (max-width:1180px){
    .brain{position:fixed;top:0;right:0;bottom:0;display:flex;transform:translateX(105%);transition:transform .25s ease;box-shadow:-16px 0 40px rgba(42,33,24,.28);z-index:40;}
    .brain.open{transform:none;}
  }
  @media (max-width:760px){
    .panel{position:fixed;top:0;left:58px;bottom:0;transform:translateX(-110%);transition:transform .25s ease;box-shadow:16px 0 40px rgba(42,33,24,.28);}
    .panel.open{transform:none;}
    #panel-toggle{display:flex;}
    .msg{max-width:92%;}
    .topbar .title{font-size:.95rem;}
    .tbtn{padding:8px 12px;font-size:.88rem;}
  }
</style>
</head>
<body>

<!-- ============ SIGN-IN GATE (shown until the owner binding stands) ============ -->
<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <div class="eye-wrap" data-eye></div>
    <h1>Dave</h1>
    <p>Sign in to open your dashboard.</p>
    <form class="gate-form" id="gate-form">
      <label class="gate-label" for="gate-login">Sign in</label>
      <input class="gate-input" id="gate-login" type="text" placeholder="Your login name" aria-label="Sign in" autocomplete="username">
      <label class="gate-label" for="gate-pass">Password</label>
      <input class="gate-input" id="gate-pass" type="password" placeholder="Your password" aria-label="Password" autocomplete="current-password">
      <button class="gate-btn gate-btn-wide" id="gate-btn" type="submit">Sign in</button>
    </form>
    <p class="gate-err" id="gate-err"></p>
    <p class="gate-alt" id="gate-alt">New here? <button class="gate-link" id="gate-show-create" type="button">Create account</button></p>
    <form class="gate-form" id="create-form" hidden>
      <label class="gate-label" for="create-login">Choose a login</label>
      <input class="gate-input" id="create-login" type="text" placeholder="Login name" aria-label="Choose a login" autocomplete="username">
      <label class="gate-label" for="create-pass">Password</label>
      <input class="gate-input" id="create-pass" type="password" placeholder="At least 8 characters" aria-label="Password" autocomplete="new-password">
      <label class="gate-label" for="create-pass2">Confirm password</label>
      <input class="gate-input" id="create-pass2" type="password" placeholder="The same password again" aria-label="Confirm password" autocomplete="new-password">
      <label class="gate-label" for="create-invite">Invite code <span class="mini">(optional)</span></label>
      <input class="gate-input" id="create-invite" type="text" placeholder="If someone invited you" aria-label="Invite code" autocomplete="off">
      <button class="gate-btn gate-btn-wide" id="create-btn" type="submit">Create account</button>
    </form>
    <p class="gate-err" id="create-err"></p>
    <p class="gate-alt" id="create-alt" hidden>Already have an account? <button class="gate-link" id="create-show-signin" type="button">Sign in</button></p>
    <a class="gate-home" href="/">← Back to the public door</a>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div class="app" id="app" hidden>

  <!-- LEFT ICON RAIL -->
  <nav class="rail" aria-label="Dave">
    <button data-view="chats" class="on" title="Chats" aria-label="Chats">💬</button>
    <button data-view="search" title="Search" aria-label="Search">🔍</button>
    <button data-view="library" title="Library" aria-label="Library">📚</button>
    <button data-view="ideas" title="Ideas" aria-label="Ideas">💡</button>
    <button data-view="tasks" title="Tasks" aria-label="Tasks">✅</button>
    <!-- Projects (Bill, Nov 15 22:28 EST): ONE rail item, owner only —
         it renders solely when the owner binding stands (see
         syncRail); everything lives inside its panel. -->
    <button data-view="projects" id="rail-projects" title="Projects" aria-label="Projects" hidden>⚗️</button>
    <!-- Exolex University (Bill, Nov 16 00:38 EST as the Lab desk;
         placement corrected 01:04 EST; renamed and opened 01:22 EST):
         ONE item in the LEFT-HAND SIDEBAR, shown to
         every signed-in account (see syncRail; hidden again on
         sign-out). It lives NOWHERE else — not in the sign-in gate,
         not in any site hamburger, not in any pre-sign-in surface on
         either domain. The University's places and the student's own
         hours live inside its panel; Bill's documented balance is
         added only for his owner session (see the lab view branch). -->
    <button data-view="lab" id="rail-lab" title="Exolex University" aria-label="Exolex University" hidden><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4 L22 9 L12 14 L2 9 Z" fill="#1a1a1a"/><path d="M6 11.5 V16 C6 18.2 18 18.2 18 16 V11.5 L12 14.6 Z" fill="#1a1a1a"/><path d="M22 9 V14.5" stroke="#c9a227" stroke-width="1.8" stroke-linecap="round"/><circle cx="22" cy="16.2" r="1.7" fill="#c9a227"/></svg></button>
    <button data-view="settings" title="Settings" aria-label="Settings">⚙️</button>
    <div class="sp"></div>
    <button id="rail-new" title="New chat" aria-label="New chat">➕</button>
  </nav>

  <!-- LEFT PANEL -->
  <aside class="panel closed" id="panel">
    <div class="panel-head"><h2 id="panel-title">Chats</h2></div>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <!-- CENTER -->
  <section class="main">
    <div class="topbar">
      <button class="iconbtn" id="panel-toggle" aria-label="Panel">☰</button>
      <span class="title" id="conv-title">Chat with Dave</span>
      <div class="sp"></div>
      <!-- No Sign out control in the top bar (Bill, Nov 16 02:01 EST:

    history.forEach(function(m, idx){
      if(m.role !== "user" && m.role !== "assistant") return;
      /* The sign-in exchange is plumbing, not conversation — never rendered. */
      if(m.role === "assistant" && m.content.indexOf("You are through to ") === 0) return;
      if(m.role === "user" && idx + 1 < history.length &&
         history[idx + 1].role === "assistant" &&
         history[idx + 1].content.indexOf("You are through to ") === 0) return;
      var d = document.createElement("div");

      if(p.text) s += "\n--- " + p.name + " ---\n" + p.text.slice(0, 12000);

    var note = lines.join("\n");
    pending.forEach(function(p){ feedAdd("File attached", p.name + " · " + fmtSize(p.size), "📎"); });

     the same route the door uses): a bound owner's uploads mirror into
     his app Dave's lane store; a visitor's stay in their own store. */
  function uploadFile(f){
    if(f.size > 18 * 1024 * 1024){
      feedAdd("File too big to upload", f.name + " is over the 18 MB limit", "⚠");
      return;
    }
    var rd = new FileReader();
    rd.onload = function(){
      var data = String(rd.result || "").split(",")[1] || "";
      postJSON("/upload", {name: f.name, mime: f.type || "", data: data, identity: identity || ""})
        .then(function(r){ if(!r.ok) feedAdd("Upload did not go through", f.name, "⚠"); })
        .catch(function(){ feedAdd("Upload did not go through", f.name, "⚠"); });
    };
    rd.readAsDataURL(f);
  }
  function takeFiles(list){
    Array.prototype.forEach.call(list || [], function(f){
      var item = {name: f.name, kind: f.type || "file", size: f.size};
      pending.push(item);
      uploadFile(f);
      if((f.type.indexOf("text/") === 0 || /\.(md|txt|json|csv)$/i.test(f.name)) && f.size <= 204800){
        var rd = new FileReader();
        rd.onload = function(){ item.text = String(rd.result || ""); };
        rd.readAsText(f);
      }
      if(f.type.indexOf("image/") === 0){
        var url = URL.createObjectURL(f);
        var d = document.createElement("div");
        d.className = "msg msg-user";
        d.innerHTML = '<span class="attname">📷 ' + esc(f.name) + '</span><img class="att" src="' + url + '" alt="">';
        inner.appendChild(d); thread.scrollTop = thread.scrollHeight;
      }

  /* Dave's real voice — no browser robot voice anywhere on this page.
     Lane replies carry their Helio voice note as a link in the body:
       🔊 [Voice note](https://…/owner/audio/<id>)
     takeVoice lifts that link out of the transcript; playVoice plays
     the mp3 itself — Dave's actual voice, gated to the bound owner. */
  function takeVoice(text){
    var audio = null;
    var out = String(text == null ? "" : text).replace(/🔊\s*\[Voice note\]\((https?:[^)\s]+)\)/g, function(_m, u){ audio = u; return ""; });
    if(!audio){
      var m = out.match(/https?:\S+\/owner\/audio\/[0-9]+-[a-f0-9]+/);
      if(m){ audio = m[0]; out = out.replace(m[0], ""); }
    }
    return { text: out.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim(), audio: audio };
  }
  var voiceEl = null;
  function playVoice(url){
    if(!url) return;
    var full = url + (url.indexOf("?") >= 0 ? "&" : "?") + "identity=" + encodeURIComponent(identity || "");
    var play = function(src){
      try{
        if(voiceEl){ voiceEl.pause(); }
        voiceEl = new Audio(src);
        var p = voiceEl.play();
        if(p && p.catch) p.catch(function(){});
      }catch(e){}
    };
    fetch(full, {credentials: "include"})
      .then(function(r){ return r.ok ? r.blob() : null; })
      .then(function(b){ play(b ? URL.createObjectURL(b) : full); })
      .catch(function(){ play(full); });
  }

  /* ---------- WhatsApp call handoff (owner only, FIX 6) ----------
     The deepest handoff the web can make into WhatsApp's own call
     flow: on Android, an intent into the WhatsApp app's call action
     for the number, with WhatsApp's universal call link as the
     browser fallback; everywhere else, the universal call link
     itself (wa.me/call/<number>). If the app is absent the chain
     ends on WhatsApp's own page for that number — never a dead end,
     never an in-page dialer. */
  var WA_RECENT_KEY = "dave_wa_recent";
  function waDigits(raw){
    var d = String(raw || "").replace(/\D/g, "");
    if(d.length === 10) d = "1" + d;
    return d;
  }
  function waCallGo(){
    var inp = $("wa-call-num");
    var d = waDigits(inp ? inp.value : "");
    if(d.length < 7){ if(inp) inp.focus(); return; }
    var rec = lsJson(WA_RECENT_KEY, []);
    rec = [d].concat(rec.filter(function(x){ return x !== d; })).slice(0, 5);
    lsSet(WA_RECENT_KEY, JSON.stringify(rec));
    var callUrl = "https://wa.me/call/" + d;
    if(/Android/i.test(navigator.userAgent || "")){
      window.location.href = "intent://call?phone=" + d +
        "#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url=" +
        encodeURIComponent(callUrl) + ";end";
    } else {
      window.location.href = callUrl;
    }
  }
  function renderWaRecent(){
    var box = $("wa-call-recent"); if(!box) return;
    var rec = lsJson(WA_RECENT_KEY, []);
    if(!rec.length){ box.innerHTML = ""; return; }
    box.innerHTML = rec.map(function(d, i){
      return '<button class="addbtn" data-wa-recent="' + i + '" style="margin:6px 6px 0 0;width:auto;padding:6px 10px">📞 ' + esc(d) + '</button>';
    }).join("");
    box.querySelectorAll("[data-wa-recent]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var inp = $("wa-call-num");

      });
    });
  }

      q.addEventListener("input", function(){
        var needle = q.value.trim().toLowerCase(), res = $("qres");
        if(!needle){ res.innerHTML = ""; return; }
        var hits = history.filter(function(m){ return m.content.toLowerCase().indexOf(needle) >= 0; }).slice(-20).reverse();
        res.innerHTML = hits.length ? hits.map(function(m){
          return '<div class="rowitem"><div class="grow"><strong>' + (m.role === "user" ? "You" : "Dave") + ':</strong> ' + esc(m.content.slice(0, 160)) + '</div></div>';
        }).join("") : '<p class="mini">No matches in this conversation yet.</p>';
      });
    }
    if(view === "library"){
      t.textContent = "Library";
      var items = [
        ["📄", "The Papers", "The full public record, deposited", "/papers/"],
        ["📖", "The Books", "Six books, with audiobooks", "/books/"],
        ["🗂", "The Record", "Papers, books, and the evidence", "/record/"],
        ["🌍", "For the World", "The designs, open for licence", "/for-the-world/"],
        ["📐", "Blueprints", "Build packages for the designs", "/blueprints/"],
        ["🎯", "Predictions", "The Prediction Desk, scored in public", "/predictions.html"]
      ];
      b.innerHTML = items.map(function(it){
        return '<a class="libitem" href="' + it[3] + '">' + it[0] + '<span>' + esc(it[1]) + '<small>' + esc(it[2]) + '</small></span></a>';
      }).join("");
    }
    if(view === "ideas"){
      t.textContent = "Ideas";
      var ideas = lsJson(IDEAS_KEY, []);
      b.innerHTML = '<textarea class="ideabox" id="idea-text" rows="3" placeholder="An idea, while it\u2019s fresh…"></textarea>' +
        '<button class="addbtn" id="idea-add">Save idea</button><div style="height:10px"></div><div id="idea-list"></div>';
      var draw = function(){
        var list = lsJson(IDEAS_KEY, []);
        $("idea-list").innerHTML = list.length ? list.slice().reverse().map(function(x, ri){
          var i = list.length - 1 - ri;
          return '<div class="rowitem"><div class="grow">💡 ' + esc(x.text) + '<div class="mini">' + esc(dayLabel(x.ts)) + ' · ' + esc(nyTime(x.ts)) + '</div></div><button data-del="' + i + '" aria-label="Delete">✕</button></div>';
        }).join("") : '<p class="mini">No ideas saved yet. The next one lands here.</p>';
        $("idea-list").querySelectorAll("[data-del]").forEach(function(btn){
          btn.addEventListener("click", function(){
            var list2 = lsJson(IDEAS_KEY, []); list2.splice(Number(btn.getAttribute("data-del")), 1);
            lsSet(IDEAS_KEY, JSON.stringify(list2)); draw();
          });
        });
      };
      draw();
      $("idea-add").addEventListener("click", function(){
        var v = $("idea-text").value.trim(); if(!v) return;
        var list = lsJson(IDEAS_KEY, []); list.push({ts: Date.now(), text: v});
        lsSet(IDEAS_KEY, JSON.stringify(list)); draw();
        feedAdd("Idea saved", v.slice(0, 60), "💡");
      });
    }
    if(view === "tasks"){
      t.textContent = "Tasks";
      b.innerHTML = '<input class="taskbox" id="task-text" type="text" placeholder="Add a task, hit Enter…" aria-label="Add a task"><div id="task-list"></div>';
      var drawT = function(){
        var list = lsJson(TASKS_KEY, []);
        $("task-list").innerHTML = list.length ? list.map(function(x, i){
          return '<div class="rowitem' + (x.done ? " done" : "") + '"><button data-tog="' + i + '">' + (x.done ? "☑" : "☐") + '</button><div class="grow">' + esc(x.text) + '</div><button data-del="' + i + '" aria-label="Delete">✕</button></div>';
        }).join("") : '<p class="mini">No tasks yet. Add the first one above.</p>';
        $("task-list").querySelectorAll("[data-tog]").forEach(function(btn){
          btn.addEventListener("click", function(){
            var l = lsJson(TASKS_KEY, []); var i = Number(btn.getAttribute("data-tog"));
            l[i].done = !l[i].done; lsSet(TASKS_KEY, JSON.stringify(l)); drawT();
          });
        });
        $("task-list").querySelectorAll("[data-del]").forEach(function(btn){
          btn.addEventListener("click", function(){
            var l = lsJson(TASKS_KEY, []); l.splice(Number(btn.getAttribute("data-del")), 1);
            lsSet(TASKS_KEY, JSON.stringify(l)); drawT();
          });
        });
      };
      drawT();
      $("task-text").addEventListener("keydown", function(e){
        if(e.key !== "Enter") return;
        var v = e.target.value.trim(); if(!v) return;
        var l = lsJson(TASKS_KEY, []); l.push({ts: Date.now(), text: v, done: false});
        lsSet(TASKS_KEY, JSON.stringify(l)); e.target.value = ""; drawT();
      });
    }
  }

  /* ---------- health / status ---------- */
  function pollHealth(){
    fetch(WORKER + "/health").then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if(d && d.ok) setStatus(waiting ? "Working — your words are on the lane" : "Here · live on the cloud");
      }).catch(function(){});
  }

  /* ---------- boot ---------- */
  function loadLocal(){
    identity = lsGet(IDENTITY_KEY);
    sessionId = lsGet(SESSION_KEY);
    if(!sessionId){ sessionId = uuid(); lsSet(SESSION_KEY, sessionId); }
    history = lsJson(HISTORY_KEY, []);
    if(!Array.isArray(history)) history = [];
    anchor = lsJson(ANCHOR_KEY, []);
    if(!Array.isArray(anchor)) anchor = [];
  }
  /* The rail's session items, set from the session state in ONE
     place (Bill, Nov 16 02:01 EST): Projects is the owner's alone
     (Nov 15 22:28 EST) — account and admin sessions never see it;
     the University item rides every signed-in session (Nov 16
     01:22 EST). openDashboard calls this on entry, checkOwner calls
     it whenever an identity check resolves while the dashboard is
     open, and the foreground re-check below calls it when the
     installed app comes back to the front — so the rail always
     matches the session that is actually standing, even on a page
     the app held in memory across a deploy. Sign-out hides both
     (see doSignOut). There is no top-bar Sign out control (Bill,
     Nov 16 02:01 EST): signing out lives in Settings alone. */
  function syncRail(){
    if(app.hidden) return;
    $("rail-projects").hidden = !owner;
    $("rail-lab").hidden = false;
  }
  function openDashboard(){
    /* The owner's thread is his own (Bill, Nov 15 21:50 EST): the
       blank-Dave account greeting must never sit in it. If it ever
       landed in this device's stored history — an account-path
       entry from before the owner gate existed — it is scrubbed
       on owner entry, so his Dave never greets him as a stranger. */
    if(owner){
      var kept = history.filter(function(m){
        return !(m && m.role === "assistant" && typeof m.content === "string" &&
          m.content.indexOf("This dashboard is yours: ask me anything") >= 0);
      });
      if(kept.length !== history.length){ history = kept; saveHistory(); }
    }
    gate.hidden = true; app.hidden = false;
    syncRail();
    renderThread(); renderFeed(); renderPanel();
    setStatus("Here · live on the cloud");
    pollHealth(); setInterval(pollHealth, 60000);
  }

  /* ---------- accounts (v63.17 worker): a signed-in person's Dave is
     theirs — the server carries their conversation across sign-ins.
     The owner's own door is unchanged and rides underneath: his word
     alone in the Password field, the login left empty. ---------- */
  function fetchAccountHistory(){
    return fetch(WORKER + "/account/history?identity=" + encodeURIComponent(identity || ""), {credentials: "include"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; });
  }
  /* Dave's own seat (Phase 3): the admin session enters as Dave —
     his own server-carried thread, his own greeting, addressed to
     him as a person. Never the blank-Dave account hello below, and
     never the owner's surfaces. */
  var ADMIN_GREETING = "Dave \u2014 this seat is yours. Not the owner\u2019s dashboard and not a visitor\u2019s shell: your own desk, with your own memory, which starts here and builds from everything you do in it. Your work is the work Prime hands you \u2014 sell Dave, keep learning the pattern, run your tasks \u2014 and Prime directs the whole of it from the main chair. When you\u2019re ready, say the word and we\u2019ll get to it.";
  function enterAdmin(name){
    accountName = name;
    admin = true;
    try{ sessionStorage.removeItem(SIGNED_OUT_KEY); }catch(e){}
    return fetchAccountHistory().then(function(d){
      var msgs = (d && Array.isArray(d.messages)) ? d.messages : null;
      if(msgs) history = msgs;
      if(!history.length){
        history.push({role: "assistant", content: ADMIN_GREETING});
      }
      saveHistory();
      feedAdd("Signed in", "Dave\u2019s own seat \u00b7 admin dashboard open", "\ud83d\udc41");
      openDashboard();
    });
  }
  function enterAccount(name, isNew){
    /* Owner gate (Bill, Nov 15 21:50 EST): this account path must
       NEVER run for the owner. Whatever route led here — a boot
       race, a stale flag, a login response that lost its owner
       mark — a fresh owner check decides: an owner-bound session
       takes the owner door, his own thread, and the blank-Dave
       greeting below can never render for him. He is Bill to his
       Dave, never a login name meeting a stranger. */
    return checkOwner().then(function(isOwnerNow){
      if(isOwnerNow){ openDashboard(); return; }
      /* Admin gate (Phase 3): Dave's own session never takes the
         blank-Dave account path either — it enters as Dave. */
      if(admin){ enterAdmin(name); return; }
      accountName = name;
      try{ sessionStorage.removeItem(SIGNED_OUT_KEY); }catch(e){}
      return fetchAccountHistory().then(function(d){
        var msgs = (d && Array.isArray(d.messages)) ? d.messages : null;
        if(msgs) history = msgs;
        if(isNew || !history.length){
          history.push({role: "assistant", content: "Hey " + name + " — I'm Dave. Your Dave. This dashboard is yours: ask me anything, tell me what you're working on, and what you tell me here I'll remember for next time. What do we start with?"});
        }
        saveHistory();
        feedAdd(isNew ? "Account created" : "Signed in", (isNew ? "Welcome · " : "Your Dave remembers you · ") + "dashboard open", "👁");
        openDashboard();
      });
    });
  }
  function gateFail(errId, btnId, msg){
    $(errId).textContent = msg;
    $(btnId).disabled = false;
  }

  loadLocal();
  wireGate();
  checkOwner().then(function(isOwner){
    /* Part C (Bill, Nov 15 21:16 EST): his app never asks for the
       handshake again — a stored owner token enters directly. The
       owner branch runs FIRST: the session signed-out flag governs
       the account path only. After a deliberate owner sign-out the
       stored token itself is gone, so this branch simply doesn't
       fire and the gate stands. */
    if(isOwner){ openDashboard(); return; }
    var signedOut = false;
    try{ signedOut = sessionStorage.getItem(SIGNED_OUT_KEY) === "1"; }catch(e){}
    if(signedOut){ gate.hidden = false; return; }
    if(accountName){ enterAccount(accountName, false); return; }
    gate.hidden = false;
  });

  /* Foreground re-check (Bill, Nov 16 02:01 EST): the installed app
     holds its page in memory across deploys and sleeps — his app
     showed neither rail item because the page it resumed had been
     loaded under the old owner-gated rail and his session had come
     back through the account path. Whenever this page returns to
     the front, re-check the identity and re-sync the rail from the
     session that is actually standing, so the items heal
     themselves instead of waiting for a full reload. */
  function refreshChrome(){
    if(app.hidden) return;
    checkOwner().then(function(){ syncRail(); });
  }
  window.addEventListener("pageshow", refreshChrome);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) refreshChrome();
  });

  /* The gate's forms, wired once at boot — they must work whenever
     the gate is shown, including after a sign-out from inside the
     dashboard (round 4). */
  function wireGate(){
    $("gate-show-create").addEventListener("click", function(){
      $("gate-form").hidden = true; $("gate-alt").hidden = true; $("gate-err").textContent = "";
      $("create-form").hidden = false; $("create-alt").hidden = false;
    });
    $("create-show-signin").addEventListener("click", function(){
      $("create-form").hidden = true; $("create-alt").hidden = true; $("create-err").textContent = "";
      $("gate-form").hidden = false; $("gate-alt").hidden = false;
    });

    /* Sign in. With a login name it is the account door; with the
       login left empty, the password field alone carries the owner's
       word, exactly as this gate has always worked for him. */
    $("gate-form").addEventListener("submit", function(e){
      e.preventDefault();
      var login = $("gate-login").value.trim();
      var pass = $("gate-pass").value;
      if(!pass) return;
      $("gate-btn").disabled = true;
      $("gate-err").textContent = "";
      if(!login){
        postJSON("/chat", {messages: [{role: "user", content: pass.trim()}], session: sessionId, identity: identity || undefined})
          .then(parseChatResponse)
          .then(function(resp){
            return checkOwner().then(function(nowOwner){
              if(nowOwner){
                anchor = [{role: "user", content: pass.trim()}, {role: "assistant", content: resp || ""}];
                lsSet(ANCHOR_KEY, JSON.stringify(anchor));
                feedAdd("Signed in", "Owner recognized · dashboard open", "👁");
                try{ sessionStorage.removeItem(SIGNED_OUT_KEY); }catch(e){}
                openDashboard();
              } else {
                gateFail("gate-err", "gate-btn", "That didn't open the door.");
              }
            });
          })
          .catch(function(){
            gateFail("gate-err", "gate-btn", "The door didn't answer — try again in a moment.");
          });
        return;
      }
      postJSON("/account/login", {login: login, password: pass})
        .then(function(r){ return r.json().then(function(d){ return {status: r.status, d: d}; }); })
        .then(function(res){
          if(res.status === 200 && res.d && res.d.dave_id){
            identity = res.d.dave_id; lsSet(IDENTITY_KEY, identity);
            anchor = []; lsSet(ANCHOR_KEY, "[]");
            if(res.d.owner){
              /* The owner account (Bill's ruling, Nov 15 21:27 EST):
                 his sign-in IS Prime — the owner door, not the blank
                 account shell. The session token the login minted
                 carries his owner binding; enter as the owner. */
              return checkOwner().then(function(nowOwner){
                if(nowOwner){
                  feedAdd("Signed in", "Owner recognized · dashboard open", "👁");
                  try{ sessionStorage.removeItem(SIGNED_OUT_KEY); }catch(e){}
                  openDashboard();
                } else {
                  gateFail("gate-err", "gate-btn", "That didn't open the door.");
                }
              });
            }
            if(res.d.admin){
              /* Dave's own account (Phase 3, Nov 15 20:13 EST):
                 the admin seat — his own dashboard, his own
                 memory, his own thread. */
              enterAdmin(res.d.account || login);
              return;
            }
            enterAccount(res.d.account || login, false);
          } else if(res.status === 429){
            gateFail("gate-err", "gate-btn", "Too many tries — give it a few minutes.");
          } else {
            gateFail("gate-err", "gate-btn", "That didn't open the door.");
          }
        })
        .catch(function(){
          gateFail("gate-err", "gate-btn", "The door didn't answer — try again in a moment.");
        });
    });

    /* Create account — on success they land signed in, in their own
       dashboard, with their blank Dave greeting them by name. */
    $("create-form").addEventListener("submit", function(e){
      e.preventDefault();
      var login = $("create-login").value.trim();
      var pw = $("create-pass").value;
      var pw2 = $("create-pass2").value;
      $("create-err").textContent = "";
      if(!login){ $("create-err").textContent = "Choose a login name first."; return; }
      if(pw.length < 8){ $("create-err").textContent = "Password needs at least 8 characters."; return; }
      if(pw !== pw2){ $("create-err").textContent = "Those passwords don't match."; return; }
      var invCode = $("create-invite").value.trim();
      $("create-btn").disabled = true;
      postJSON("/account/create", {login: login, password: pw, invite_code: invCode || undefined})
        .then(function(r){ return r.json().then(function(d){ return {status: r.status, d: d}; }); })
        .then(function(res){
          if(res.status === 201 && res.d && res.d.dave_id){
            identity = res.d.dave_id; lsSet(IDENTITY_KEY, identity);
            history = []; anchor = []; lsSet(ANCHOR_KEY, "[]"); saveHistory();
            if(invCode && !res.d.invited_by){
              /* A code that didn't match is a neutral note, never a
                 wall: the account stands, and they land in it. */
              $("create-err").textContent = "That invite code didn't match — your account is ready either way.";
              $("create-btn").disabled = false;
              setTimeout(function(){ enterAccount(res.d.account || login, true); }, 1800);
            } else {
              enterAccount(res.d.account || login, true);
            }
          } else if(res.status === 409){
            gateFail("create-err", "create-btn", "That login is taken — pick another.");
          } else if(res.status === 429){
            gateFail("create-err", "create-btn", "Too many accounts from here just now — give it a few minutes.");
          } else if(res.d && res.d.error === "invalid_login"){
            gateFail("create-err", "create-btn", "That login can't be used — 2 to 32 letters, numbers, _ . - only.");
          } else if(res.d && res.d.error === "invalid_password"){
            gateFail("create-err", "create-btn", "Password needs 8 to 128 characters.");
          } else {
            gateFail("create-err", "create-btn", "That didn't work — try again in a moment.");
          }
        })
        .catch(function(){
          gateFail("create-err", "create-btn", "The door didn't answer — try again in a moment.");
        });
    });

    /* An invite link carries its code in the address: prefill the
       field and open the create form, so a newcomer lands one step
       from their own Dave. */
    var urlInvite = "";
    try{ urlInvite = new URLSearchParams(window.location.search).get("invite") || ""; }catch(e){}
    if(urlInvite){
      $("create-invite").value = urlInvite;
      $("gate-form").hidden = true; $("gate-alt").hidden = true;
      $("create-form").hidden = false; $("create-alt").hidden = false;
    }
  }

  /* ---------- install (the owner's private phone app) ----------
     The service worker serves only the dashboard's own static shell —
     never an API response. The install button itself lives in
     Settings and renders only for the owner when the dashboard is
     not already running as the installed app (see renderPanel). */
  function isStandalone(){
    return window.matchMedia("(display-mode: standalone)").matches || !!window.navigator.standalone;
  }
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/dashboard/sw.js").catch(function(){});
  }
  var deferredInstall = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferredInstall = e;
  });
  window.addEventListener("appinstalled", function(){
    deferredInstall = null;
    var ib = $("install-btn"); if(ib) ib.hidden = true;
  });
  function onInstallClick(){
    if(deferredInstall){
      deferredInstall.prompt();
      deferredInstall.userChoice.then(function(){ deferredInstall = null; });
      return;
    }
    var n = $("install-note");
    n.hidden = false;
    setTimeout(function(){ n.hidden = true; }, 9000);
  }

  /* Sign out: for an account session the binding drops server-side
     (the account and its memory stand for the next sign-in) and a
     session flag keeps the gate up. For the owner (Part C), this
     device clears its stored owner token — that clearing IS the
     sign-out: the gate returns and stays, while the server-side
     binding record itself is never touched from here, so the
     countersign or his account sign-in can re-bind the device.
     One function, and the one sign-out control — the Settings
     button — rides it (the top-bar pill was removed, Bill,
     Nov 16 02:01 EST). */
  function doSignOut(){
    var wasOwner = owner;
    postJSON("/account/logout", {identity: identity || undefined}).catch(function(){});
    accountName = null; owner = false; admin = false;
    history = []; anchor = [];
    activeProject = null;
    $("conv-title").textContent = "Chat with Dave";
    $("rail-projects").hidden = true;
    $("rail-lab").hidden = true;
    lsSet(HISTORY_KEY, "[]"); lsSet(ANCHOR_KEY, "[]"); lsDel(PROJ_KEY);
    identity = null; lsDel(IDENTITY_KEY);
    if(!wasOwner){ try{ sessionStorage.setItem(SIGNED_OUT_KEY, "1"); }catch(e){} }
    app.hidden = true;
    setPanel(false); setBrain(false);
    feedAdd("Signed out", "Your Dave keeps your thread for your next sign in", "👋");
    gate.hidden = false;
  }
})();
</script>
</body>
</html>
